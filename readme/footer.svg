<svg width="900" height="150" viewBox="0 0 900 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PIKO footer">
  <defs>
    <linearGradient id="fsky" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#BFE6E0"></stop>
      <stop offset="100%" stop-color="#98D8C8"></stop>
    </linearGradient>
    <radialGradient id="fsun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3C8" stop-opacity="0.95"></stop>
      <stop offset="60%" stop-color="#FBE39A" stop-opacity="0.3"></stop>
      <stop offset="100%" stop-color="#FBE39A" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="fm1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6FBE8E"></stop>
      <stop offset="100%" stop-color="#4EA277"></stop>
    </linearGradient>
    <linearGradient id="fm2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4C9A6E"></stop>
      <stop offset="100%" stop-color="#357E57"></stop>
    </linearGradient>
    <linearGradient id="fm3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E6E48"></stop>
      <stop offset="100%" stop-color="#1E5537"></stop>
    </linearGradient>
    <linearGradient id="frule" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0">
      <stop offset="0%" stop-color="#2FA84F" stop-opacity="0"></stop>
      <stop offset="30%" stop-color="#159C8C" stop-opacity="0.7"></stop>
      <stop offset="70%" stop-color="#1E7FD1" stop-opacity="0.7"></stop>
      <stop offset="100%" stop-color="#1E7FD1" stop-opacity="0"></stop>
    </linearGradient>
  </defs>

  
  <clipPath id="fclip"><rect x="0" y="0" width="900" height="150" rx="10"></rect></clipPath>
  <g clip-path="url(#fclip)">

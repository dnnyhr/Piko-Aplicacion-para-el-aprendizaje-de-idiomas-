<svg width="900" height="150" viewBox="0 0 900 150" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:auto;max-width:900px;">
<style>
  @keyframes fsun { 0%,100%{opacity:.9;transform:scale(1)} 50%{opacity:1;transform:scale(1.08)} }
  @keyframes fsway { 0%,100%{transform:rotate(-7deg)} 50%{transform:rotate(9deg)} }
  @keyframes fleaf { 0%,100%{transform:rotate(-6deg)} 50%{transform:rotate(6deg)} }
  @keyframes fcloud { 0%,100%{transform:translateX(0)} 50%{transform:translateX(46px)} }
  @keyframes frule { 0%,100%{opacity:.8} 50%{opacity:1} }
  @keyframes fbirdfly { 0%,100%{transform:translate(0,0)} 50%{transform:translate(28px,-10px)} }
</style>
<defs>
  <linearGradient id="fsky" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#BFE6E0"/><stop offset="100%" stop-color="#98D8C8"/></linearGradient>
  <radialGradient id="fsunG" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFF3C8" stop-opacity="0.95"/><stop offset="60%" stop-color="#FBE39A" stop-opacity="0.3"/><stop offset="100%" stop-color="#FBE39A" stop-opacity="0"/></radialGradient>
  <linearGradient id="fm1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6FBE8E"/><stop offset="100%" stop-color="#4EA277"/></linearGradient>
  <linearGradient id="fm2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4C9A6E"/><stop offset="100%" stop-color="#357E57"/></linearGradient>
  <linearGradient id="fm3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2E6E48"/><stop offset="100%" stop-color="#1E5537"/></linearGradient>
  <linearGradient id="frule" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0"><stop offset="0%" stop-color="#2FA84F" stop-opacity="0"/><stop offset="30%" stop-color="#159C8C" stop-opacity="0.7"/><stop offset="70%" stop-color="#1E7FD1" stop-opacity="0.7"/><stop offset="100%" stop-color="#1E7FD1" stop-opacity="0"/></linearGradient>
  <clipPath id="fclip"><rect x="0" y="0" width="900" height="150" rx="10"/></clipPath>
</defs>
<g clip-path="url(#fclip)">
  <rect width="900" height="150" fill="url(#fsky)"/>
  <g style="transform-origin:770px 52px;animation:fsun 6s ease-in-out infinite">
    <circle cx="770" cy="52" r="90" fill="url(#fsunG)"/>
    <circle cx="770" cy="52" r="26" fill="#FBD873" opacity="0.9"/>
  </g>
  <g fill="#FFFFFF" opacity="0.85">
    <g style="animation:fcloud 6s ease-in-out infinite"><ellipse cx="120" cy="34" rx="34" ry="12"/><ellipse cx="150" cy="29" rx="24" ry="10"/><ellipse cx="94" cy="30" rx="20" ry="9"/></g>
    <g opacity="0.7" style="animation:fcloud 6s ease-in-out -3s infinite"><ellipse cx="420" cy="26" rx="28" ry="10"/><ellipse cx="446" cy="22" rx="20" ry="8"/><ellipse cx="398" cy="22" rx="16" ry="7"/></g>
  </g>
  <g stroke="#2E6E48" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6">
    <g style="animation:fbirdfly 6s ease-in-out infinite"><path d="M150,44 C155,39 160,39 165,44 C170,39 175,39 180,44"/></g>
    <g style="animation:fbirdfly 6s ease-in-out -3s infinite"><path d="M210,62 C214,58 218,58 222,62 C226,58 230,58 234,62"/></g>
  </g>
  <polygon points="0,150 0,96 130,58 300,104 460,54 640,106 820,64 900,92 900,150" fill="url(#fm1)"/>
  <polygon points="0,150 0,118 180,82 380,120 560,80 760,122 900,96 900,150" fill="url(#fm2)"/>
  <polygon points="0,150 0,138 220,112 470,140 700,110 900,134 900,150" fill="url(#fm3)"/>
  <g style="transform-origin:450px 138px;animation:fleaf 6s ease-in-out infinite">
    <path d="M450,138 C450,128 450,122 450,116" fill="none" stroke="#1E5537" stroke-width="2" stroke-linecap="round"/>
    <path d="M450,128 C444,123 436,123 433,127 C438,131 446,131 450,132 Z" fill="#4EA277"/>
    <path d="M450,123 C456,118 464,118 467,122 C462,126 454,126 450,127 Z" fill="#6FBE8E"/>
    <path d="M450,118 C446,113 440,112 437,114 C440,117 445,118 450,118 Z" fill="#7ACF63"/>
  </g>
  <g stroke="#255E36" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.8">
    <g style="transform-origin:63px 146px;animation:fsway 6s ease-in-out infinite"><path d="M60,146 C58,140 57,137 55,133 M63,146 C63,140 63,137 64,132 M66,146 C69,140 70,137 72,133"/></g>
    <g style="transform-origin:843px 146px;animation:fsway 6s ease-in-out -3s infinite"><path d="M840,146 C838,140 837,137 835,133 M843,146 C843,140 843,137 844,132 M846,146 C849,140 850,137 852,133"/></g>
  </g>
</g>
<rect x="0" y="0" width="900" height="3" fill="url(#frule)" style="animation:frule 6s ease-in-out infinite"/>
</svg>

<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Piko banner">
<style>
  @keyframes sunPulse { 0%,100%{opacity:.9;transform:scale(1)} 50%{opacity:1;transform:scale(1.03)} }
  @keyframes cloudA { 0%{transform:translateX(0)} 100%{transform:translateX(40px)} }
  @keyframes cloudB { 0%{transform:translateX(0)} 100%{transform:translateX(-36px)} }
  @keyframes windSway { 0%{transform:rotate(-3deg) skewX(-2deg)} 50%{transform:rotate(7deg) skewX(4deg)} 100%{transform:rotate(-3deg) skewX(-2deg)} }
  @keyframes birdFlyA { 0%{transform:translate(0,0)} 50%{transform:translate(30px,-10px)} 100%{transform:translate(60px,4px)} }
  @keyframes birdFlyB { 0%{transform:translate(60px,4px)} 50%{transform:translate(30px,-10px)} 100%{transform:translate(0,0)} }
  @keyframes flap { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(.55)} }
  @keyframes leafSway { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(3deg)} }
  @keyframes sparkle { 0%,100%{opacity:0;transform:scale(.4)} 50%{opacity:1;transform:scale(1)} }
  @keyframes dramatic { 0%{opacity:0;transform:scale(1.4) translateY(6px)} 60%{opacity:1} 100%{opacity:1;transform:scale(1) translateY(0)} }
  @keyframes underline { 0%{transform:scaleX(0)} 100%{transform:scaleX(1)} }
  @keyframes fadeUp { 0%{opacity:0;transform:translateY(14px)} 100%{opacity:1;transform:translateY(0)} }
  @keyframes bookRise { 0%{opacity:0;transform:translateY(8px)} 100%{opacity:1;transform:translateY(0)} }

  #sun-g { transform-origin:1050px 96px; animation:sunPulse 7s ease-in-out infinite; }
  #cloud-a { animation:cloudA 22s ease-in-out infinite alternate; }
  #cloud-b { animation:cloudB 30s ease-in-out infinite alternate; }
  #bird-a { animation:birdFlyA 9s ease-in-out infinite alternate; }
  #bird-b { animation:birdFlyB 11s ease-in-out infinite alternate; }
  #bird-a path { transform-origin:488px 82px; animation:flap 1.1s ease-in-out infinite; }
  #bird-b path { transform-origin:555px 102px; animation:flap 1.1s ease-in-out .3s infinite; }
  .grass1 { transform-origin:70px 290px; animation:windSway 3.4s ease-in-out infinite; }
  .grass2 { transform-origin:150px 292px; animation:windSway 3.8s ease-in-out .4s infinite; }
  .grass3 { transform-origin:430px 288px; animation:windSway 3.1s ease-in-out .8s infinite; }
  .grass4 { transform-origin:640px 290px; animation:windSway 3.6s ease-in-out .2s infinite; }
  .grass5 { transform-origin:830px 286px; animation:windSway 2.9s ease-in-out .6s infinite; }
  .grass6 { transform-origin:1010px 288px; animation:windSway 3.5s ease-in-out 1s infinite; }
  .grass7 { transform-origin:1140px 286px; animation:windSway 3.2s ease-in-out .5s infinite; }
  #leaf-g { transform-origin:252px 132px; animation:leafSway 4.5s ease-in-out infinite; }
  #spark1 { transform-origin:400px 128px; animation:sparkle 4s ease-in-out infinite; }
  #spark2 { transform-origin:360px 101px; animation:sparkle 5s ease-in-out 1.2s infinite; }

  #book5 { opacity:0; animation:bookRise .55s cubic-bezier(.2,.7,.2,1) .3s forwards; }
  #book4 { opacity:0; animation:bookRise .55s cubic-bezier(.2,.7,.2,1) .42s forwards; }
  #book3 { opacity:0; animation:bookRise .55s cubic-bezier(.2,.7,.2,1) .54s forwards; }
  #book2 { opacity:0; animation:bookRise .55s cubic-bezier(.2,.7,.2,1) .66s forwards; }
  #book1 { opacity:0; animation:bookRise .55s cubic-bezier(.2,.7,.2,1) .78s forwards; }
  #ribbon { opacity:0; animation:bookRise .55s cubic-bezier(.2,.7,.2,1) .9s forwards; }

  #title-g { transform-origin:452px 150px; opacity:0; animation:dramatic 1.1s cubic-bezier(.16,.84,.3,1) .95s forwards; }
  #underline-r { transform-origin:452px 0; transform:scaleX(0); animation:underline .6s cubic-bezier(.2,.8,.2,1) 1.7s forwards; }
  #subtitle-t { opacity:0; animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) 1.85s forwards; }

  text { font-family: Georgia, 'Times New Roman', serif; }
</style>

<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0%" stop-color="#BFE6E0"/><stop offset="45%" stop-color="#98D8C8"/><stop offset="100%" stop-color="#77C7AC"/>
  </linearGradient>
  <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FFF3C8" stop-opacity="0.95"/><stop offset="60%" stop-color="#FBE39A" stop-opacity="0.35"/><stop offset="100%" stop-color="#FBE39A" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sunBody" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFF4CE"/><stop offset="100%" stop-color="#FBD873"/>
  </linearGradient>
  <linearGradient id="mtn1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6FBE8E"/><stop offset="100%" stop-color="#4EA277"/></linearGradient>
  <linearGradient id="mtn2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4C9A6E"/><stop offset="100%" stop-color="#357E57"/></linearGradient>
  <linearGradient id="mtn3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2E6E48"/><stop offset="100%" stop-color="#1E5537"/></linearGradient>
  <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3F864F"/><stop offset="100%" stop-color="#2C6A3C"/></linearGradient>
  <linearGradient id="underlineGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#2FA84F"/><stop offset="50%" stop-color="#159C8C"/><stop offset="100%" stop-color="#1E7FD1"/>
  </linearGradient>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#123E27" flood-opacity="0.45"/>
  </filter>
</defs>

<rect width="1200" height="300" fill="url(#sky)"/>

<g id="sun-g"><circle cx="1050" cy="96" r="110" fill="url(#sunGlow)"/><circle cx="1050" cy="96" r="40" fill="url(#sunBody)"/></g>

<g fill="#FFFFFF" opacity="0.85">
  <g id="cloud-a"><ellipse cx="230" cy="66" rx="46" ry="17"/><ellipse cx="270" cy="60" rx="34" ry="15"/><ellipse cx="196" cy="60" rx="28" ry="13"/></g>
  <g id="cloud-b" opacity="0.7"><ellipse cx="620" cy="46" rx="40" ry="14"/><ellipse cx="656" cy="42" rx="28" ry="12"/><ellipse cx="590" cy="42" rx="24" ry="11"/></g>
</g>

<g stroke="#2E6E48" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.7">
  <g id="bird-a"><path d="M470,84 C476,78 482,78 488,84 C494,78 500,78 506,84"/></g>
  <g id="bird-b"><path d="M540,104 C545,99 550,99 555,104 C560,99 565,99 570,104"/></g>
</g>

<polygon points="0,300 0,176 150,104 320,168 470,92 640,172 800,110 980,166 1200,108 1200,300" fill="url(#mtn1)"/>
<polygon points="0,300 0,210 180,140 360,204 540,132 740,210 940,150 1120,206 1200,168 1200,300" fill="url(#mtn2)"/>
<polygon points="0,300 0,244 220,196 460,240 680,192 900,242 1100,200 1200,232 1200,300" fill="url(#mtn3)"/>
<path d="M0,300 L0,262 C220,238 420,270 640,258 C860,246 1020,272 1200,254 L1200,300 Z" fill="url(#hill)"/>

<g stroke="#255E36" stroke-width="2.2" fill="none" stroke-linecap="round" class="grass1"><path d="M66,292 C63,283 61,279 58,272 M70,292 C70,282 70,277 70,270 M74,292 C77,283 79,279 82,272"/></g>
<g stroke="#2A6B3E" stroke-width="2.2" fill="none" stroke-linecap="round" class="grass2"><path d="M146,294 C143,285 141,281 139,275 M150,294 C151,285 151,280 152,273 M154,294 C157,286 159,282 161,276"/></g>
<g stroke="#255E36" stroke-width="2.4" fill="none" stroke-linecap="round" class="grass3"><path d="M426,290 C422,281 420,276 417,269 M430,290 C430,280 430,274 431,267 M434,290 C438,281 440,276 443,269"/></g>
<g stroke="#2A6B3E" stroke-width="2.2" fill="none" stroke-linecap="round" class="grass4"><path d="M636,292 C632,283 630,279 628,272 M640,292 C640,282 640,277 640,270 M644,292 C648,283 650,279 652,272"/></g>
<g stroke="#255E36" stroke-width="2.4" fill="none" stroke-linecap="round" class="grass5"><path d="M826,288 C822,279 820,274 817,267 M830,288 C830,278 830,272 831,265 M834,288 C838,279 840,274 843,267"/></g>
<g stroke="#2A6B3E" stroke-width="2.2" fill="none" stroke-linecap="round" class="grass6"><path d="M1006,290 C1002,281 1000,277 998,270 M1010,290 C1010,280 1010,275 1011,268 M1014,290 C1018,281 1020,277 1022,270"/></g>
<g stroke="#255E36" stroke-width="2.2" fill="none" stroke-linecap="round" class="grass7"><path d="M1136,288 C1132,279 1130,275 1128,268 M1140,288 C1140,278 1140,273 1141,266 M1144,288 C1148,279 1150,275 1152,268"/></g>

<ellipse cx="250" cy="266" rx="152" ry="14" fill="#154028" opacity="0.22"/>

<g id="book5"><rect x="120" y="242" width="260" height="22" rx="3" fill="#EFE6CE"/><rect x="120" y="236" width="258" height="20" rx="3" fill="#2F6B45"/><rect x="120" y="236" width="7" height="20" rx="3" fill="#245537"/><rect x="120" y="236" width="258" height="4" rx="3" fill="#3C7E54"/><text x="252" y="250" text-anchor="middle" font-weight="700" font-size="14" letter-spacing="2.5" fill="#FBF7EA">INGLES</text></g>

<g id="book4"><rect x="132" y="216" width="236" height="22" rx="3" fill="#EFE6CE"/><rect x="132" y="210" width="234" height="20" rx="3" fill="#B0561F"/><rect x="132" y="210" width="7" height="20" rx="3" fill="#8E4417"/><rect x="132" y="210" width="234" height="4" rx="3" fill="#C56A2E"/><text x="252" y="224" text-anchor="middle" font-weight="700" font-size="14" letter-spacing="2.5" fill="#FBF7EA">GARÍFUNA</text></g>

<g id="book3"><rect x="126" y="190" width="248" height="22" rx="3" fill="#EFE6CE"/><rect x="126" y="184" width="246" height="20" rx="3" fill="#1F6577"/><rect x="126" y="184" width="7" height="20" rx="3" fill="#164E5C"/><rect x="126" y="184" width="246" height="4" rx="3" fill="#2A7B8E"/><text x="252" y="198" text-anchor="middle" font-weight="700" font-size="14" letter-spacing="2.5" fill="#FBF7EA">RAMA</text></g>

<g id="book2"><rect x="142" y="164" width="216" height="22" rx="3" fill="#EFE6CE"/><rect x="142" y="158" width="214" height="20" rx="3" fill="#2C6E49"/><rect x="142" y="158" width="7" height="20" rx="3" fill="#20583A"/><rect x="142" y="158" width="214" height="4" rx="3" fill="#388457"/><text x="252" y="172" text-anchor="middle" font-weight="700" font-size="14" letter-spacing="2.5" fill="#FBF7EA">MAYANGNA</text></g>

<g id="book1"><rect x="152" y="138" width="196" height="22" rx="3" fill="#EFE6CE"/><rect x="152" y="132" width="194" height="20" rx="3" fill="#9E3A26"/><rect x="152" y="132" width="7" height="20" rx="3" fill="#7E2C1C"/><rect x="152" y="132" width="194" height="4" rx="3" fill="#B44A34"/><text x="252" y="146" text-anchor="middle" font-weight="700" font-size="14" letter-spacing="2.5" fill="#FBF7EA">MISKITO</text></g>

<g id="ribbon"><path d="M320,132 L320,170 L314,162 L308,170 L308,132 Z" fill="#F2C230"/></g>

<g id="leaf-g">
  <path d="M252,132 C252,118 252,108 252,102" fill="none" stroke="#2C6A3C" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M252,114 C246,108 238,108 234,112 C240,116 248,116 252,118 Z" fill="#4EA277"/>
  <path d="M252,108 C258,102 266,102 270,106 C264,110 256,110 252,112 Z" fill="#6FBE8E"/>
</g>

<g fill="#FFF3C8">
  <path id="spark1" d="M400,120 l2,6 6,2 -6,2 -2,6 -2,-6 -6,-2 6,-2 z"/>
  <path id="spark2" d="M360,96 l1.4,4 4,1.4 -4,1.4 -1.4,4 -1.4,-4 -4,-1.4 4,-1.4 z"/>
</g>

<g id="title-g">
  <text x="452" y="150" font-weight="700" font-size="84" fill="#164028" filter="url(#softShadow)">PIKO</text>
</g>
<rect id="underline-r" x="452" y="163" width="218" height="9" rx="5" fill="url(#underlineGrad)"/>
<text id="subtitle-t" x="452" y="204" font-style="italic" font-weight="600" font-size="21" fill="#FFFFFF" filter="url(#softShadow)">Aprendizaje de lenguas indígenas para escuelas rurales de Nicaragua</text>

</svg>

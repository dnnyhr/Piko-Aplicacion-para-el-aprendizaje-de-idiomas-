# El certificado de Let's Encrypt (uno solo para los dos nombres, ver
# despliegue/README.md) y las cabeceras de seguridad. Va en cada server 443.

ssl_certificate     /etc/letsencrypt/live/certificado-piko/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/certificado-piko/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

include /etc/nginx/snippets/cabeceras.conf;

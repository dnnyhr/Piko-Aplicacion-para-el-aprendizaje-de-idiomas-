<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Piko</title>
<meta name="theme-color" content="#0F5D3D">

<!-- Fredoka, la misma de la aplicación y la landing. Se baja de Google: si no
     hay red la página cae al tipo del sistema y no se rompe nada — lo mismo
     que le pasa a la voz, que también vive del otro lado del cable. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Instalada desde «Agregar a pantalla de inicio», Chrome en Android la abre
     sin barra de direcciones y se queda así toda la clase. Es más confiable
     que pedir pantalla completa por código, que Android concede a medias y
     abandona en cuanto el sistema muestra cualquier cosa encima. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* Todo negro y sin nada de más: esto es una cara, no una página. */
*{margin:0; padding:0; box-sizing:border-box}
html,body{
  height:100%; background:#000; overflow:hidden;
  font-family:Fredoka,"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
}

#piko-caja{position:fixed; inset:0; opacity:0; transition:opacity .15s ease}
#piko-caja.puesta{opacity:1}

#escena{position:fixed; inset:0}
#escena > *{
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:contain;
  opacity:0; transition:opacity .18s ease;
  pointer-events:none;
}
#escena > .puesta{opacity:1}

/* ---------- la tarjeta del ejercicio ---------- */
/**
 * La palabra va en una franja abajo y la cara no se toca: sigue entera y a
 * pantalla completa, que es lo único que importa acá.
 *
 * La franja es corta a propósito. El pico —lo que se mueve cuando Piko habla—
 * termina cerca del 70 % de la altura del dibujo, así que una franja de un
 * cuarto de pantalla deja la cara completa por encima. Eso es lo que hace que
 * la palabra se lea como algo que Piko está diciendo y no como un cartel: se
 * le ve el pico moverse mientras suena.
 */
#tarjeta{
  position:fixed; left:0; right:0; bottom:0; z-index:6;
  display:grid; grid-template-columns:1fr auto 1fr;
  align-items:center; gap:.2rem 1.1rem;
  padding:.55rem 1.1rem;
  padding-bottom:calc(.6rem + env(safe-area-inset-bottom, 0px));
  background:#F7F0E4; color:#16241D; text-align:center;
  border-top:8px solid #0F5D3D;
  box-shadow:0 -12px 30px rgba(0,0,0,.4);
  /* Entra deslizándose desde abajo, como el aviso: aparecer de golpe encima de
     la cara se ve como un error de dibujo. */
  transform:translateY(105%);
  transition:transform .26s cubic-bezier(.2,.9,.3,1), border-color .22s ease;
  pointer-events:none;
}
body.con-tarjeta #tarjeta{transform:none}

#tarjeta .rotulo{
  justify-self:end; text-align:right;
  font-size:clamp(.6rem,1.9vh,.85rem); font-weight:600;
  letter-spacing:.2em; text-transform:uppercase; color:#197249;
}
/* La palabra es lo único que el chico tiene que leer, así que se lleva todo el
   alto que la franja se permite. Contra la altura y no contra el ancho: lo que
   escasea en una pantalla acostada es el alto. */
#tarjeta .palabra{
  font-family:Fredoka,"Nunito Sans",system-ui,sans-serif;
  font-weight:600; font-size:clamp(1.7rem,9vh,3.6rem);
  line-height:1.05; letter-spacing:-.01em; overflow-wrap:anywhere;
}
#tarjeta .pie{
  justify-self:start; text-align:left;
  font-size:clamp(.75rem,2.2vh,1.05rem); font-weight:500; color:#4A5B51;
}

/* Cada estado del ejercicio tiene su color, y la franja de arriba lo repite:
   desde el fondo del aula la palabra no se lee, pero la franja sí. */
#tarjeta.escuchando{border-color:#60C5FA}
#tarjeta.escuchando .pie{color:#0F5D3D}
#tarjeta.escuchando .pie::before{
  content:""; display:inline-block; vertical-align:middle;
  width:.6em; height:.6em; margin-right:.45em; border-radius:50%;
  background:#60C5FA; animation:escucha 1.1s ease-in-out infinite;
}
@keyframes escucha{0%,100%{transform:scale(.7); opacity:.45} 50%{transform:scale(1.15); opacity:1}}

#tarjeta.bien{border-color:#97C137}
#tarjeta.bien .pie{color:#3F6B12; font-weight:700}
#tarjeta.bien .pie::before{content:"✓ "}

#tarjeta.mal{border-color:#E97927}
#tarjeta.mal .pie{color:#A9531A; font-weight:700}
#tarjeta.mal .pie::before{content:"↻ "}

/* En una pantalla angosta las tres cosas no entran en una línea. Se apilan, que
   ahí sobra alto: parado, el dibujo es tan ancho que deja negro arriba y abajo,
   y la franja se come el de abajo sin tapar nada. */
@media (max-width:560px){
  #tarjeta{grid-template-columns:1fr; gap:.1rem}
  #tarjeta .rotulo, #tarjeta .pie{justify-self:center; text-align:center}
}

/* El aviso rojo pasa por encima de la franja: que la cara diga que se quedó sin
   conexión importa más que la palabra del ejercicio. */
#aviso{z-index:7}

@media (prefers-reduced-motion:reduce){
  #tarjeta{transition:none}
  #tarjeta.escuchando .pie::before{animation:none}
}

/* ---------- el velo de arranque ---------- */
#velo{
  position:fixed; inset:0; z-index:10;
  background:#0F5D3D; color:#F7F0E4;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:1.4rem; text-align:center; padding:2rem;
}
#velo h1{font-size:clamp(1.6rem,7vw,2.6rem); font-weight:650; letter-spacing:-.02em}
#velo p{font-size:clamp(.95rem,3.6vw,1.15rem); opacity:.8; max-width:24ch; line-height:1.5}
#velo .pico{
  width:0; height:0; margin-bottom:.5rem;
  border-left:26px solid transparent; border-right:26px solid transparent;
  border-top:34px solid #E8A429;
  animation:latir 1.6s ease-in-out infinite;
}
@keyframes latir{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
#velo.ido{display:none}

/* ---------- avisos discretos ---------- */
#aviso{
  position:fixed; left:0; right:0; bottom:0; z-index:5;
  padding:.5rem; text-align:center;
  font-size:.8rem; color:#F7F0E4; background:rgba(192,57,43,.92);
  transform:translateY(100%); transition:transform .25s ease;
}
#aviso.visible{transform:translateY(0)}

/* Un botón chico para volver a pantalla completa. Aparece sólo cuando hace
   falta: Android la concede y la abandona sola en cuanto el sistema muestra
   algo encima, y sin esto la única salida es recargar la página. */
#lleno{
  position:fixed; top:.6rem; right:.6rem; z-index:8;
  width:44px; height:44px; border:none; border-radius:50%;
  background:rgba(15,93,61,.55); color:#F7F0E4;
  font-size:1.2rem; line-height:1; cursor:pointer;
  display:none;
}
#lleno.visible{display:block}

@media (prefers-reduced-motion:reduce){
  #escena > *{transition:none}
  #velo .pico{animation:none}
}
</style>
</head>
<body>

<div id="piko-caja"></div>
<div id="escena"></div>
<audio id="voz"></audio>

<div id="tarjeta">
  <p class="rotulo">Ejercicio</p>
  <p class="palabra" id="tarjetaPalabra"></p>
  <p class="pie" id="tarjetaPie"></p>
</div>

<div id="velo">
  <div class="pico"></div>
  <h1>Piko</h1>
  <p>Tocá la pantalla para empezar</p>
</div>

<button id="lleno" title="Pantalla completa" aria-label="Pantalla completa">⛶</button>
<div id="aviso"></div>

<script src="piko.js"></script>
<script src="vigilia.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const escena = $('escena');
const voz = $('voz');

/* El Piko animado se monta una sola vez y se queda ahí. Las expresiones que
   sabe hacer las hace moviendo las pupilas, la boca y los párpados; las que no
   conoce caen a mostrar el archivo suelto de `caras/`. */
Piko.montar($('piko-caja'));

let ws = null;
let arrancado = false;
const piezas = new Map();   // nombre → elemento
let puesta = null;

// ═══════════════════════════════════════════════════════════════════════
//  El arranque
// ═══════════════════════════════════════════════════════════════════════

/**
 * Los navegadores de teléfono no dejan reproducir video ni audio hasta que
 * alguien toca la pantalla. No es un capricho que se pueda saltear: sin ese
 * toque, Piko se queda mudo y quieto sin decir por qué.
 *
 * Por eso el velo. Además es el momento de pedir pantalla completa y de pedir
 * que no se apague, que también requieren un gesto de por medio.
 */
/**
 * Pedir pantalla completa, y decirlo si no se puede.
 *
 * Tiene que salir del propio manejador del toque y **antes de cualquier
 * `await`**: en cuanto la función cede el control, el navegador da por
 * terminado el gesto del usuario y rechaza el pedido. Ése es el motivo más
 * común de que esto «no haga nada» sin dar error.
 *
 * Y aun saliendo bien, Android la abandona sola en cuanto el sistema muestra
 * algo encima —una notificación, el teclado—. Por eso queda el botón de la
 * esquina para volver, y por eso conviene más instalarla desde «Agregar a
 * pantalla de inicio», que arranca sin barra y se queda.
 */
function pedirPantallaCompleta() {
  const raiz = document.documentElement;
  const pedir = raiz.requestFullscreen || raiz.webkitRequestFullscreen;
  if (!pedir) {
    avisar('Este navegador no permite pantalla completa');
    $('lleno').classList.add('visible');
    return;
  }

  Promise.resolve(pedir.call(raiz, { navigationUI: 'hide' }))
    .then(() => {
      avisar(null);
      $('lleno').classList.remove('visible');
      // El bloqueo de orientación sólo se concede estando en pantalla completa.
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    })
    .catch((e) => {
      // Si falla, el botón queda a mano en vez de dejar la página sin salida.
      avisar(`Pantalla completa rechazada: ${e && e.message ? e.message : e}`);
      $('lleno').classList.add('visible');
    });
}

function arrancar() {
  if (arrancado) return;
  arrancado = true;
  $('velo').classList.add('ido');

  // Primero, sin nada asincrónico delante, o se pierde el gesto.
  pedirPantallaCompleta();

  /* Que la pantalla no se duerma. Es la cara del robot: se tiene que quedar
     encendida toda la clase, no los diez minutos que permite el ajuste del
     teléfono. Va acá adentro, con el gesto todavía fresco, porque el respaldo
     de video no puede reproducirse sin un toque de por medio. */
  Vigilia.empezar({
    respaldo: true,
    alCambiar(modo) {
      const texto = 'La pantalla puede apagarse sola — abrilo por https o dejalo cargando';
      if (modo === 'candado' || modo === 'video') {
        // Sólo borra su propio aviso: el de «sin conexión» importa más que éste
        // y no le corresponde taparlo.
        if ($('aviso').textContent === texto) avisar(null);
      } else {
        avisar(texto);
      }
    },
  });

  /* Desbloquear el audio con el mismo gesto, y armar el análisis de la onda que
     le mueve la boca a Piko. Va acá y en ningún otro lado: el contexto de audio
     nace suspendido y sólo un gesto lo despierta. Armado fuera del toque, el
     audio quedaría desviado hacia un grafo dormido y no sonaría nada. */
  prepararVoz();
  despertarAudio();
  try { voz.play().catch(() => {}); voz.pause(); } catch { }

  for (const el of piezas.values()) {
    if (el.tagName === 'VIDEO') el.play().catch(() => {});
  }
}

/* Sólo `click`. Antes escuchaba también `touchstart`, y en Android eso hacía
   que la función corriera con el gesto todavía a medio formar — el pedido de
   pantalla completa salía y el navegador lo descartaba sin avisar. */
$('velo').addEventListener('click', arrancar);
$('lleno').addEventListener('click', pedirPantallaCompleta);

/* Si Android la abandona, vuelve a aparecer el botón. */
document.addEventListener('fullscreenchange', () => {
  $('lleno').classList.toggle('visible', arrancado && !document.fullscreenElement);
});

// ═══════════════════════════════════════════════════════════════════════
//  Las expresiones
// ═══════════════════════════════════════════════════════════════════════

/**
 * Se cargan todas de entrada, no una por una al pedido.
 *
 * Con el túnel de por medio, bajar un video en el momento en que hay que
 * mostrarlo se ve como un parpadeo negro justo cuando Piko tenía que
 * reaccionar. Teniéndolas todas puestas y ocultas, cambiar de expresión es
 * cambiar una clase: instantáneo y sin red.
 */
function prepararCaras(caras) {
  escena.textContent = '';
  piezas.clear();
  puesta = null;

  for (const cara of caras) {
    let el;
    if (cara.tipo === 'video') {
      el = document.createElement('video');
      el.src = `caras/${encodeURIComponent(cara.archivo)}`;
      el.loop = true;
      el.playsInline = true;
      el.preload = 'auto';
      // Arranca en silencio porque hasta el primer toque es la única forma de
      // que el navegador lo deje reproducirse. Después se le saca el silencio.
      el.muted = true;
    } else {
      el = document.createElement('img');
      el.src = `caras/${encodeURIComponent(cara.archivo)}`;
      el.alt = '';
      el.decoding = 'async';
    }
    escena.appendChild(el);
    piezas.set(cara.nombre, el);
  }
}

/** Apaga lo que hubiera puesto de la escena de archivos. */
function apagarArchivo() {
  if (!puesta) return;
  puesta.classList.remove('puesta');
  if (puesta.tagName === 'VIDEO') puesta.pause();
  puesta = null;
}

function mostrar(nombre) {
  // Primero el Piko animado: si sabe hacer esta expresión, la mirada viaja de
  // donde está a donde va en vez de desvanecerse.
  if (Piko.conoce(nombre)) {
    Piko.estado(nombre);
    apagarArchivo();
    $('piko-caja').classList.add('puesta');
    return;
  }

  // Si no la conoce, se muestra el archivo tal cual.
  const el = piezas.get(nombre);
  if (!el || puesta === el) return;
  $('piko-caja').classList.remove('puesta');
  apagarArchivo();

  el.classList.add('puesta');
  if (el.tagName === 'VIDEO') {
    el.currentTime = 0;
    if (arrancado) el.muted = false;
    el.play().catch(() => {});
  }
  puesta = el;
}

// ═══════════════════════════════════════════════════════════════════════
//  La boca sigue a la voz
// ═══════════════════════════════════════════════════════════════════════

/**
 * El pico se abre con el volumen real del audio, cuadro a cuadro.
 *
 * La alternativa fácil era abrir y cerrar en bucle mientras dure el sonido, y
 * se ve mal por un motivo concreto: la boca sigue moviéndose en las pausas
 * entre frases y se queda quieta en medio de una palabra larga. Lo que el ojo
 * lee como hablar es que la boca se abra en las sílabas y se cierre en los
 * silencios, y eso sólo sale mirando la onda.
 *
 * El audio se desvía por un `AnalyserNode`. Ojo con esto: desde que se llama a
 * `createMediaElementSource`, el elemento deja de sonar por su cuenta y sólo
 * se escucha lo que se conecte a la salida. Y el contexto arranca suspendido,
 * así que hay que despertarlo con un gesto — el mismo toque del velo que ya
 * hacía falta para que el navegador dejara sonar algo.
 */
let contexto = null;      // null = sin preparar, false = este navegador no puede
let analizador = null;
let muestras = null;
let cuadro = null;
let relojTitere = null;
let pico = 0;
let suave = 0;

function prepararVoz() {
  if (analizador || contexto === false) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) { contexto = false; return; }
  try {
    contexto = new AC();
    const fuente = contexto.createMediaElementSource(voz);
    analizador = contexto.createAnalyser();
    analizador.fftSize = 512;
    fuente.connect(analizador);
    analizador.connect(contexto.destination);   // sin esto no se oye nada
    muestras = new Uint8Array(analizador.fftSize);
  } catch {
    contexto = false;
    analizador = null;
  }
}

function despertarAudio() {
  if (contexto && contexto.state === 'suspended') contexto.resume().catch(() => {});
}

/** La energía de la onda en este instante: no un pico suelto, sino cuánto
    sonido hay de verdad. Un chasquido no abre la boca; una sílaba sí. */
function energia() {
  analizador.getByteTimeDomainData(muestras);
  let suma = 0;
  for (let i = 0; i < muestras.length; i++) {
    const v = (muestras[i] - 128) / 128;
    suma += v * v;
  }
  return Math.sqrt(suma / muestras.length);
}

function seguirLaVoz() {
  cuadro = requestAnimationFrame(seguirLaVoz);
  const ahora = energia();

  /* Se mide contra el pico reciente y no contra un número fijo. Con un umbral
     fijo, un audio grabado bajo apenas movería el pico y uno fuerte lo dejaría
     abierto de punta a punta. El pico decae despacio para que un grito al
     principio no deje sorda a la boca por el resto de la frase. */
  pico = Math.max(ahora, pico * 0.995);
  const bruto = pico > 0.008 ? Math.min(1, ahora / pico) : 0;

  /* Abre rápido y cierra despacio. Al revés se ve masticando: la boca alcanza
     a cerrarse del todo entre sílaba y sílaba, que es justo cuando tendría que
     seguir abierta. */
  suave += (bruto - suave) * (bruto > suave ? 0.6 : 0.18);
  Piko.boca(suave);
}

function empezarAHablar() {
  despertarAudio();

  if (analizador) {
    if (cuadro === null) { pico = 0; suave = 0; cuadro = requestAnimationFrame(seguirLaVoz); }
    return;
  }

  titereEmpezar();
}

/* El títere: abrir y cerrar a ritmo fijo. Se nota falso, pero una cara inmóvil
   mientras suena una voz se nota más. Lo usan los dos casos en que no hay onda
   para mirar — un navegador sin Web Audio, y la voz del propio sistema, que no
   pasa por ningún `<audio>`. */
function titereEmpezar() {
  if (relojTitere) return;
  let abierto = false;
  relojTitere = setInterval(() => Piko.boca((abierto = !abierto) ? 1 : 0), 170);
}

function titereParar() {
  if (relojTitere) { clearInterval(relojTitere); relojTitere = null; }
  Piko.boca(null);
}

function dejarDeHablar() {
  if (cuadro !== null) { cancelAnimationFrame(cuadro); cuadro = null; }
  if (relojTitere) { clearInterval(relojTitere); relojTitere = null; }
  Piko.boca(null);
}

voz.addEventListener('playing', empezarAHablar);
voz.addEventListener('pause', dejarDeHablar);
voz.addEventListener('ended', dejarDeHablar);
voz.addEventListener('emptied', dejarDeHablar);

// ═══════════════════════════════════════════════════════════════════════
//  Lo que Piko dice
// ═══════════════════════════════════════════════════════════════════════

/**
 * La voz llega como una dirección, no como un archivo.
 *
 * El puente arma `/voz?q=...` y esta página la cuelga del mismo `<audio>` que
 * ya usan los sonidos de la carpeta. Eso no es ahorro de código: es la única
 * forma de que la boca se mueva. El pico se abre con la energía de la onda, y
 * la onda sólo se puede leer si el audio entra por el grafo que se armó en el
 * toque del velo. Cualquier camino nuevo —un `Audio()` aparte, la voz del
 * sistema— deja a Piko hablando con la cara quieta.
 */
let vozId = null;
let frasePendiente = null;

function decir(m) {
  despertarAudio();
  vozId = m.id || null;
  // Se guarda por si el audio no llega: sin internet, la dice el teléfono.
  frasePendiente = { texto: m.texto, idioma: m.idioma };
  voz.src = m.url;
  voz.play().catch((e) => {
    /* Dos fracasos distintos que se ven igual desde acá. Si el navegador no
       deja sonar sin un toque, hay que pedir el toque; si lo que no cargó fue
       el audio —el puente no pudo traerlo de Google—, el toque no arregla nada
       y del caso se encarga el manejador de `error`, que además cae a la voz
       del teléfono. Decir «tocá la pantalla» ahí sería mandar al maestro a
       tocar una pantalla que ya está tocada. */
    if (e && e.name === 'NotAllowedError') avisar('Tocá la pantalla para permitir el sonido');
  });
}

/** Le avisa al panel que terminó de hablar, y sólo una vez por frase. */
function avisarQueTermino() {
  if (vozId === null) return;
  const id = vozId;
  vozId = null;
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'vozfin', id }));
}

/**
 * El respaldo para cuando no hay red: la voz del propio teléfono.
 *
 * Suena distinta y peor, pero un robot mudo en el aula donde no hay señal es
 * exactamente el caso que este proyecto tiene que aguantar. Acá no hay onda
 * que mirar —el sistema no la presta—, así que la boca va con el títere.
 */
const AVISO_SIN_RED = 'Sin voz de Google — hablando con la del teléfono';

function hablarSinRed(texto, idioma) {
  const sintesis = window.speechSynthesis;
  if (!sintesis || !texto) { avisarQueTermino(); return; }

  avisar(AVISO_SIN_RED);
  const frase = new SpeechSynthesisUtterance(texto);
  frase.lang = idioma || 'es';
  frase.rate = 0.95;

  /* Al terminar se borra el aviso, pero sólo si sigue siendo el suyo: el de
     «sin conexión con el puente» importa más y no le corresponde taparlo. */
  const terminar = () => {
    titereParar();
    if ($('aviso').textContent === AVISO_SIN_RED) avisar(null);
    avisarQueTermino();
  };
  frase.onstart = titereEmpezar;
  frase.onend = terminar;
  frase.onerror = terminar;
  sintesis.cancel();
  sintesis.speak(frase);
}

/* El `<audio>` avisa `error` cuando el puente contesta 502 porque no pudo
   traer la voz. Se comprueba que haya una frase pendiente: un sonido de la
   carpeta que falle no tiene que ponerse a hablar. */
voz.addEventListener('error', () => {
  const frase = frasePendiente;
  frasePendiente = null;
  if (frase) hablarSinRed(frase.texto, frase.idioma);
});

voz.addEventListener('ended', () => { frasePendiente = null; avisarQueTermino(); });

function callar() {
  frasePendiente = null;
  vozId = null;
  voz.pause();
  voz.currentTime = 0;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  titereParar();
}

// ═══════════════════════════════════════════════════════════════════════
//  La tarjeta del ejercicio
// ═══════════════════════════════════════════════════════════════════════

/** `null` la saca y devuelve la cara a toda la pantalla. */
function mostrarTarjeta(tarjeta) {
  if (!tarjeta || !tarjeta.texto) {
    document.body.classList.remove('con-tarjeta');
    return;
  }
  $('tarjetaPalabra').textContent = tarjeta.texto;
  $('tarjetaPie').textContent = tarjeta.sub || '';
  $('tarjeta').className = tarjeta.estado || 'neutro';
  document.body.classList.add('con-tarjeta');
}

// ═══════════════════════════════════════════════════════════════════════
//  Conexión
// ═══════════════════════════════════════════════════════════════════════

function avisar(texto) {
  const a = $('aviso');
  if (!texto) { a.classList.remove('visible'); return; }
  a.textContent = texto;
  a.classList.add('visible');
}

function conectar() {
  const protocolo = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${protocolo}://${location.host}`);

  ws.onopen = () => {
    avisar(null);
    ws.send(JSON.stringify({ t: 'soy', rol: 'cara' }));
  };

  ws.onclose = () => {
    avisar('Sin conexión con el puente — reintentando');
    setTimeout(conectar, 1500);
  };

  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);

    if (m.t === 'catalogo') {
      prepararCaras(m.caras);
      // Si esta página se abrió tarde o se recargó, se pone al día con la
      // expresión que ya estaba puesta en vez de quedarse en negro.
      // Sin expresión puesta y sin archivos, igual se ve a Piko de frente: la
      // pantalla en negro nunca es una respuesta aceptable para una cara.
      mostrarTarjeta(m.tarjeta);
      if (m.expresion) mostrar(m.expresion);
      else if (m.caras.length) mostrar(m.caras[0].nombre);
      else mostrar('enfrente');
      return;
    }

    if (m.t === 'expresion') { mostrar(m.nombre); return; }

    if (m.t === 'sonido') {
      despertarAudio();
      /* Un archivo de la carpeta no es una frase: si no carga, no hay nada que
         decir con la voz del teléfono. */
      frasePendiente = null;
      vozId = null;
      voz.src = `sonidos/${encodeURIComponent(m.archivo)}`;
      voz.play().catch(() => avisar('Tocá la pantalla para permitir el sonido'));
      return;
    }

    if (m.t === 'voz') { decir(m); return; }

    if (m.t === 'tarjeta') { mostrarTarjeta(m.tarjeta); return; }

    if (m.t === 'callar') { callar(); }
  };
}

conectar();
</script>
